<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="innerGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#022c22" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#innerGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Subdivided Land Plot (Cadastral / Khatian Dag Boundary) -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="8 6" fill="none">
    <!-- Survey grid boundary -->
    <rect x="96" y="96" width="320" height="320" rx="36" />
    <!-- Parcel boundary lines -->
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="96" y1="256" x2="416" y2="256" />
  </g>

  <!-- Central Land Verification Shield -->
  <path d="M256 128 L360 176 C360 272 312 344 256 384 C200 344 152 272 152 176 Z" 
        fill="#064e3b" 
        stroke="url(#goldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Inner Plot Cadastral Shading inside Shield -->
  <path d="M256 142 L344 182 C344 262 304 326 256 362 C208 326 168 262 168 182 Z" 
        fill="#047857" 
        opacity="0.85" />

  <!-- Verified Checkmark with Gold Accent Tip -->
  <path d="M212 254 L244 286 L308 214" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Golden verification star/seed at top center -->
  <circle cx="256" cy="184" r="10" fill="url(#goldGrad)" />
</svg>
